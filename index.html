учит далеко и глухо, особенно на маленьких колонках и телефоне.",fix:[e("EQ: Peak 3 кГц, +1.5…2 дБ, Q 0.8")+" на снейре или лиде.","Если цель – бит под вокал, провал тут допустим: проверьте режим «Под будущий вокал»."]};case"z_harsh_hi":case"t_harsh":return{title:"Колкость 6–9 кГц",short:"+"+o+" дБ",what:"Зона 6–9 кГц громче цели на "+o+" дБ.",why:"Хэты и сибилянты начинают «торчать» и звучать отдельно от микса, будто в другом помещении.",fix:["На хэтах: "+e("EQ: Peak 7–8 кГц, −2…4 дБ, Q 2")+".","На вокале: "+e("де-эссер, 6–8 кГц")+".","Отправьте хэты немного в общий короткий реверб ("+e("реверб Room, 0.4–0.8 с, Mix 8–12%")+"), чтобы они жили в одном пространстве с барабанами."]};case"z_harsh_lo":return{title:"Мало верха 6–9 кГц",short:o+" дБ",what:"6–9 кГц ниже цели на "+n(o)+" дБ.",why:"Микс звучит тускло, хэты не читаются.",fix:[e("High Shelf 8 кГц, +1.5 дБ")+" на шине барабанов.",i?"В Analog mode небольшой спад нормален.":"Проверьте сэмплы хэтов: возможно, они уже очень тёмные."]};case"z_air_hi":return{title:"Перебор «воздуха»",short:"+"+o+" дБ выше 10 кГц",what:"Выше 10 кГц на "+o+" дБ больше цели.",why:"Звучит цифрово-колко, шипит, утомляет.",fix:[e("High Shelf 12 кГц, −2 дБ")+" на мастере или на хэтах.","Уберите лишние эксайтеры или подъёмы верха на шинах."]};case"z_air_lo":return{title:"Мало «воздуха»",short:o+" дБ выше 10 кГц",what:"Выше 10 кГц на "+n(o)+" дБ меньше цели.",why:"Микс без открытости, будто под одеялом.",fix:[e("High Shelf 12 кГц, +1.5…2 дБ")+" на мастере, широкий Q.","Проверьте, не стоит ли где-то High Cut ниже 15 кГц."]};case"slope_dark":return{title:"Микс темнее цели",short:"наклон "+o+" дБ/окт",what:"Общий наклон спектра "+o+" дБ/окт, у цели "+a.target+". Чем меньше число, тем темнее.",why:"В сравнении с розовым шумом и референсами весь микс сдвинут в низ.",fix:[e("EQ на мастер-шине: Low Shelf 120 Гц −1 дБ и High Shelf 6 кГц +1 дБ")+": мягкий наклон.","Лучше исправлять на уровне инструментов, а мастер трогать на 1–1.5 дБ."]};case"slope_bri
