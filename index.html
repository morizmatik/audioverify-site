e("EQ: Peak 7–8 кГц, −2…4 дБ, Q 2")+".","На вокале: "+e("де-эссер, 6–8 кГц")+".","Отправьте хэты немного в общий короткий реверб ("+e("реверб Room, 0.4–0.8 с, Mix 8–12%")+"), чтобы они жили в одном пространстве с барабанами."]};case"z_harsh_lo":return{title:"Мало верха 6–9 кГц",short:o+" дБ",what:"6–9 кГц ниже цели на "+n(o)+" дБ.",why:"Микс звучит тускло, хэты не читаются.",fix:[e("High Shelf 8 кГц, +1.5 дБ")+" на шине барабанов.",i?"В Analog mode небольшой спад нормален.":"Проверьте сэмплы хэтов: возможно, они уже очень тёмные."]};case"z_air_hi":return{title:"Перебор «воздуха»",short:"+"+o+" дБ выше 10 кГц",what:"Выше 10 кГц на "+o+" дБ больше цели.",why:"Звучит цифрово-колко, шипит, утомляет.",fix:[e("High Shelf 12 кГц, −2 дБ")+" на мастере или на хэтах.","Уберите лишние эксайтеры или подъёмы верха на шинах."]};case"z_air_lo":return{title:"Мало «воздуха»",short:o+" дБ выше 10 кГц",what:"Выше 10 кГц на "+n(o)+" дБ меньше цели.",why:"Микс без открытости, будто под одеялом.",fix:[e("High Shelf 12 кГц, +1.5…2 дБ")+" на мастере, широкий Q.","Проверьте, не стоит ли где-то High Cut ниже 15 кГц."]};case"slope_dark":return{title:"Микс темнее цели",short:"наклон "+o+" дБ/окт",what:"Общий наклон спектра "+o+" дБ/окт, у цели "+r.target+". Чем меньше число, тем темнее.",why:"В сравнении с розовым шумом и референсами весь микс сдвинут в низ.",fix:[e("EQ на мастер-шине: Low Shelf 120 Гц −1 дБ и High Shelf 6 кГц +1 дБ")+": мягкий наклон.","Лучше исправлять на уровне инструментов, а мастер трогать на 1–1.5 дБ."]};case"slope_bright":return{title:"Микс ярче цели",short:"наклон "+o+" дБ/окт",what:"Общий наклон "+o+" дБ/окт, у цели "+r.target+".",why:"Микс кажется тонким и резким.",fix:[e("High Shelf 6 кГц, −1…1.5 дБ")+" на мастере.","Проверьте хэты и тарелки: часто они громче нужного."]};case"t_res":return{title:"Резонанс "+(r.f>=1e3?(r.f/1e3).toFixed(2)+" кГц":r.f+" Гц"),short:"+"+o+" дБ, "+r.zone,what:"Узкий пик на "+r.f+" Гц торчит на "+o+" дБ над соседними частотами и держится в "+r.frac+"% громких участков.",why:"боль"===r.zone?"Зона 2–4.5 кГц: именно такие пики «режут уши» и делают снейр пластиковым.":"Зона 6–9 кГц: свист и колкость хэтов, звук отделяется от микса.",fix:["Найдите источник: поставьте "+e("EQ")+" на подозреваемые дорожки и включите анализатор.",e("EQ: Peak "+r.f+" Гц, −3…6 дБ, Q 6–8")+" на источнике.","Если пик плавает: динамический вырез ("+e("многополосный компрессор")+" узкой полосой) или FabFilter Pro-Q в Dynamic.",i?"Analog mode: после выреза добавьте лёгкую сатурацию, чтобы не потерять плотность.":"Не режьте на мастере, если источник один."]};case"t_sub":return{title:"Перебор саба на участке",short:"+"+o+" дБ",what:"С "+t(r.t)+" примерно "+Math.round(r.dur)+" с саб громче цели на "+o+" дБ.",why:"На этом участке низ будет гудеть в машине.",fix:["Проверьте, какие ноты 808 или баса здесь звучат: низкие ноты дают больше саба.",e("автоматизация громкости баса или EQ: Low Shelf 60 Гц")+" на этом отрезке.","Подумайте о транспонировании партии на октаву выше в этих тактах."]};case"t_kick":return{title:"Бочка тонет в басе",short:"выделение "+o+" дБ (цель ≥ "+r.target+")",what:"С "+t(r.t)+(r.n?" подряд "+r.n+" ударов":"")+" бочка поднимается над фоном перед ударом в среднем всего на "+o+" дБ. Это те же удары, что красные и жёлтые точки на графике Kick Focus.",why:"Удар не выделяется над длинным басом: бочка громкая, но «задыхается» и не бьёт.",fix:["Сайдчейн: "+e("компрессор на басе с сайдчейном от бочки: Ratio 4:1, Attack 0.5–1 мс, Release 60–120 мс, −3…6 дБ")+".","Разведите по частотам: бочке оставьте 50–70 Гц, басу 40 Гц и ниже или 80–100 Гц.","Проверьте фазу: включите "+e("инверсия фазы")+" на басе и сравните, где бочка плотнее.","Укоротите хвост бочки, если он длинный, или ноты 808 на ударах."]};case"t_phase":return{title:"Фазовая проблема в низу",short:"корреляция "+o,what:"С "+t(r.t)+" корреляция ниже 120 Гц падает до "+o+".",why:"В моно (клубы, телефон, часть машин) низ на этом участке пропадает или гуляет.",fix:["Переведите низ в моно: "+e("ширина стерео 0% на басе")+" или "+e("расширитель стерео")+" только выше 150 Гц.","Уберите стерео-хорус и детюн с басовых партий.","Проверьте в моно: кнопка моно на "+e("коррелометр")+" или "+e("ширина стерео 0%")+" на мастере."]};case"t_sib":return{title:"Возможные сибилянты",short:o+" всплесков",what:"С "+t(r.t)+" короткие всплески в 6–9 кГц. Это могут быть «с» и «ш» в вокале, а могут быть хэты.",why:"Сибилянты торчат и режут ухо на громкости.",fix:["Прослушайте этот участок соло вокала.",e("де-эссер: 6–8 кГц, −3…6 дБ")+" на вокале.","Если это хэты, см. советы по колкости."]};case"t_pocket":return{title:"Бит занимает место голоса",short:"запас "+o+" дБ",what:"С "+t(r.t)+" центр бита в 1–4 кГц громче будущего голоса ("+o+" дБ запаса).",why:"Когда придёт вокал, он будет бороться с инструментами за разборчивость.",fix:["Разведите ведущие партии шире: "+e("ширина стерео 120–150%")+", голос будет в центре.","Перенесите мелодию на октаву выше или ниже голоса на этом отрезке.","Мягкий "+e("EQ: Peak 2.5 кГц, −2 дБ, Q 1")+" на мелодиях.","Подключите «призрачный вокал» в DAW (вокальный пресет синтезатора в сайдчейн Pro-Q или Neutron), чтобы увидеть, кто именно мешает."]};case"t_clip":case"tp":var l=r.sp,s=null!=l&&l>-.1,u="t_clip"===r.type;return{title:o>0?"Пик выше 0 dBTP":u?"Пик почти на 0 dBTP":"True Peak ближе −1 dBTP",short:o+" dBTP"+(null!=l?" · сэмпл "+l+" dBFS":""),what:(u?"В "+t(r.t)+" межсэмпловый пик доходит до ":"Максимальный межсэмпловый пик ")+o+" dBTP"+(null!=l?", самый громкий сэмпл "+l+" dBFS":"")+". True Peak считается с 8-кратной передискретизацией (как в BS.1770), поэтому он бывает выше пика сэмплов: это реальный уровень, до которого поднимется звук после цифро-аналогового или MP3/AAC-преобразования.",why:"Spotify и Apple перекодируют файл, и пики у 0 dBTP дают лёгкий хрип. Для стримингов советуют не выше −1 dBTP.",fix:[s?"Самый громкий сэмпл почти ровно 0 dBFS. Похоже, при экспорте включена нормализация: она поднимает уровень уже
