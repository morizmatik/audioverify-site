ора в сайдчейн Pro-Q или Neutron), чтобы увидеть, кто именно мешает."]};case"t_clip":case"tp":var l=r.sp,s=null!=l&&l>-.1,u="t_clip"===r.type;return{title:i>0?"Пик выше 0 dBTP":u?"Пик почти на 0 dBTP":"True Peak ближе −1 dBTP",short:i+" dBTP"+(null!=l?" · сэмпл "+l+" dBFS":""),what:(u?"В "+t(r.t)+" межсэмпловый пик доходит до ":"Максимальный межсэмпловый пик ")+i+" dBTP"+(null!=l?", самый громкий сэмпл "+l+" dBFS":"")+". True Peak считается с 8-кратной передискретизацией (как в BS.1770), поэтому он бывает выше пика сэмплов: это реальный уровень, до которого поднимется звук после цифро-аналогового или MP3/AAC-преобразования.",why:"Spotify и Apple перекодируют файл, и пики у 0 dBTP дают лёгкий хрип. Для стримингов советуют не выше −1 dBTP.",fix:[s?"Самый громкий сэмпл почти ровно 0 dBFS. Похоже, при экспорте включена нормализация: она поднимает уровень уже после лимитера. В настройках экспорта отключите "+e("нормализацию")+".":null,e("лимитер на мастер-шине: режим True Peak, Ceiling −1.0 dBTP")+".","Даже лимитеры с True Peak пропускают 0.2–0.5 дБ на резких атаках. Если в лимитере стоит потолок −0.2 dB, здесь легко получить около 0 dBTP: ставьте −1.0 dB с запасом.","Проверьте экспорт: Mixcheck честнее всего читает WAV. MP3 и AAC сами добавляют межсэмпловые пики."].filter(Boolean)};case"loud_hi":return{title:"Слишком громко",short:i+" LUFS",what:"Интегральная громкость "+i+" LUFS. Выше −6 LUFS почти всегда слышны искажения и пропадает удар.",why:"Стриминги всё равно сделают трек тише (до −14), а потерянная динамика не вернётся. Бочка «задыхается» от лимитера.",fix:["Ориентир для жанра: "+r.target+" LUFS.","Уменьшите вход лимитера на "+Math.round(r.target-i<0?i-r.target:2)+" дБ.","Громкость лучше получать балансом, а не лимитером: срежьте лишний саб, он съедает запас."]};case"loud_more":return{title:"Громче референсов",short:i+" LUFS (реф "+r.target+")",what:"Трек громче среднего по референсам на "+(i-r.target).toFixed(1)+" LU.",why:"Небольшой запас громкости не нужен, а
